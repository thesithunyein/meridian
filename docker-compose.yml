version: "3.9"

# Meridian ↔ HydraDB local stack.
#
# Bring up a single-node HydraDB query server backed by an on-disk SlateDB
# store, then run `node corpus/load.mjs` from the host to hydrate the canonical
# 5K-node / 18K-edge supply-chain corpus.  The Next.js dev server can then
# be pointed at the graph by exporting:
#
#   export HYDRADB_URL=http://127.0.0.1:8443
#   export HYDRADB_API_KEY=local-development-token-32-bytes
#   export HYDRADB_GRAPH=default
#
# Notes
#  - The image exposes Bolt on :7687, HTTPS query on :8443, metrics on :9090.
#  - `--user` matches the host UID/GID so the bind-mounted hydradb-data
#    directory is writable inside the container.
#  - GRAPH_ALLOW_PLAINTEXT=true is required for the unauthenticated local dev
#    path.  The image refuses to start without TLS unless this flag is set.
#  - GRAPH_AUTH_TOKEN_FILE must contain a non-empty string; we pin the token
#    here so the loader and the dev server agree on the same bearer secret.

services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: meridian-hydradb
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "7687:7687"     # Bolt (Neo4j-compatible)
      - "8443:8443"     # HTTPS query API  (POST /v1/graphs/<name>/query)
      - "9090:9090"     # Prometheus metrics
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
      HYDRA_MAX_QUERY_SCAN_EDGES: "120000"
      HYDRA_MAX_QUERY_INTERMEDIATE_ROWS: "20000"
    volumes:
      - ./.hydradb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
