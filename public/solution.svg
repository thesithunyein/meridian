<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="420" fill="#0f0f1a" rx="12"/>

  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">The Solution: Paste, Scan, Fix</text>

  <!-- Terminal window -->
  <rect x="60" y="50" width="680" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#s)"/>
  <circle cx="80" cy="70" r="5" fill="#ef4444"/>
  <circle cx="96" cy="70" r="5" fill="#eab308"/>
  <circle cx="112" cy="70" r="5" fill="#22c55e"/>
  <text x="140" y="74" font-size="11" fill="#64748b">$ pnpm scan tanstack/react-virtual@3.10.8</text>

  <!-- Verdict card -->
  <rect x="60" y="125" width="680" height="70" rx="8" fill="#1e293b" stroke="#dc2626" stroke-width="2" filter="url(#s)"/>
  <rect x="60" y="125" width="6" height="70" rx="3" fill="#dc2626"/>
  <text x="80" y="150" font-size="10" font-weight="700" fill="#fca5a5">CRIT</text>
  <text x="110" y="150" font-size="10" fill="#94a3b8">tanstack/react-virtual@3.10.8</text>
  <text x="80" y="172" font-size="12" font-weight="600" fill="#e2e8f0">17 services exposed  ·  6 lockfiles resolved  ·  6 typosquats nearby</text>
  <text x="80" y="188" font-size="11" fill="#4ade80">fix:  pnpm update tanstack/react-virtual@^3.10.9</text>

  <!-- 6 tiles grid -->
  <!-- Row 1 -->
  <rect x="60" y="215" width="216" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s)"/>
  <text x="70" y="235" font-size="9" font-weight="600" fill="#a78bfa">EXPOSED SERVICES</text>
  <text x="70" y="258" font-size="18" font-weight="700" fill="#e2e8f0">17</text>
  <text x="100" y="258" font-size="10" fill="#64748b">services</text>

  <rect x="292" y="215" width="216" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s)"/>
  <text x="302" y="235" font-size="9" font-weight="600" fill="#a78bfa">INTRO VERSION</text>
  <text x="302" y="258" font-size="18" font-weight="700" fill="#e2e8f0">3.10.8</text>
  <text x="370" y="258" font-size="10" fill="#64748b">first bad</text>

  <rect x="524" y="215" width="216" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s)"/>
  <text x="534" y="235" font-size="9" font-weight="600" fill="#a78bfa">LOCKFILE CONSUMERS</text>
  <text x="534" y="258" font-size="18" font-weight="700" fill="#e2e8f0">6</text>
  <text x="555" y="258" font-size="10" fill="#64748b">lockfiles</text>

  <!-- Row 2 -->
  <rect x="60" y="283" width="216" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s)"/>
  <text x="70" y="303" font-size="9" font-weight="600" fill="#a78bfa">SIBLING PACKAGES</text>
  <text x="70" y="326" font-size="18" font-weight="700" fill="#e2e8f0">5</text>
  <text x="90" y="326" font-size="10" fill="#64748b">shared maintainers</text>

  <rect x="292" y="283" width="216" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s)"/>
  <text x="302" y="303" font-size="9" font-weight="600" fill="#a78bfa">TYPOSQUATS</text>
  <text x="302" y="326" font-size="18" font-weight="700" fill="#e2e8f0">6</text>
  <text x="322" y="326" font-size="10" fill="#64748b">edit-distance neighbours</text>

  <rect x="524" y="283" width="216" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#s)"/>
  <text x="534" y="303" font-size="9" font-weight="600" fill="#a78bfa">BLAST RADIUS</text>
  <text x="534" y="326" font-size="18" font-weight="700" fill="#e2e8f0">29</text>
  <text x="565" y="326" font-size="10" fill="#64748b">total affected</text>

  <!-- Footer -->
  <text x="400" y="380" text-anchor="middle" font-size="10" fill="#64748b">All six queries run in parallel · ~250ms cold · ~80ms hot</text>
  <text x="400" y="398" text-anchor="middle" font-size="10" fill="#64748b">No LLM · No vector search · Reproducible to the byte</text>
</svg>
