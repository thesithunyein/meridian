<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="#fafafa" rx="12"/>

  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">The Solution: Paste, Scan, Fix</text>

  <!-- Terminal window -->
  <rect x="60" y="50" width="680" height="60" rx="8" fill="#1e1b4b" filter="url(#s)"/>
  <circle cx="80" cy="70" r="5" fill="#ef4444"/>
  <circle cx="96" cy="70" r="5" fill="#eab308"/>
  <circle cx="112" cy="70" r="5" fill="#22c55e"/>
  <text x="140" y="74" font-size="11" fill="#6b7280">$ pnpm scan tanstack/react-virtual@3.10.8</text>

  <!-- Verdict card -->
  <rect x="60" y="125" width="680" height="70" rx="8" fill="white" stroke="#ef4444" stroke-width="2" filter="url(#s)"/>
  <rect x="60" y="125" width="6" height="70" rx="3" fill="#ef4444"/>
  <text x="80" y="150" font-size="10" font-weight="700" fill="#ef4444">CRIT</text>
  <text x="110" y="150" font-size="10" fill="#6b7280">tanstack/react-virtual@3.10.8</text>
  <text x="80" y="172" font-size="12" font-weight="600" fill="#1e1b4b">17 services exposed  ·  6 lockfiles resolved  ·  6 typosquats nearby</text>
  <text x="80" y="188" font-size="11" fill="#059669">fix:  pnpm update tanstack/react-virtual@^3.10.9</text>

  <!-- 6 tiles grid -->
  <!-- Row 1 -->
  <rect x="60" y="215" width="216" height="56" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="70" y="235" font-size="9" font-weight="600" fill="#7c3aed">EXPOSED SERVICES</text>
  <text x="70" y="258" font-size="18" font-weight="700" fill="#1e1b4b">17</text>
  <text x="100" y="258" font-size="10" fill="#6b7280">services</text>

  <rect x="292" y="215" width="216" height="56" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="302" y="235" font-size="9" font-weight="600" fill="#7c3aed">INTRO VERSION</text>
  <text x="302" y="258" font-size="18" font-weight="700" fill="#1e1b4b">3.10.8</text>
  <text x="370" y="258" font-size="10" fill="#6b7280">first bad</text>

  <rect x="524" y="215" width="216" height="56" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="534" y="235" font-size="9" font-weight="600" fill="#7c3aed">LOCKFILE CONSUMERS</text>
  <text x="534" y="258" font-size="18" font-weight="700" fill="#1e1b4b">6</text>
  <text x="555" y="258" font-size="10" fill="#6b7280">lockfiles</text>

  <!-- Row 2 -->
  <rect x="60" y="283" width="216" height="56" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="70" y="303" font-size="9" font-weight="600" fill="#7c3aed">SIBLING PACKAGES</text>
  <text x="70" y="326" font-size="18" font-weight="700" fill="#1e1b4b">5</text>
  <text x="90" y="326" font-size="10" fill="#6b7280">shared maintainers</text>

  <rect x="292" y="283" width="216" height="56" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="302" y="303" font-size="9" font-weight="600" fill="#7c3aed">TYPOSQUATS</text>
  <text x="302" y="326" font-size="18" font-weight="700" fill="#1e1b4b">6</text>
  <text x="322" y="326" font-size="10" fill="#6b7280">edit-distance neighbours</text>

  <rect x="524" y="283" width="216" height="56" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="534" y="303" font-size="9" font-weight="600" fill="#7c3aed">BLAST RADIUS</text>
  <text x="534" y="326" font-size="18" font-weight="700" fill="#1e1b4b">29</text>
  <text x="565" y="326" font-size="10" fill="#6b7280">total affected</text>

  <!-- Footer -->
  <text x="400" y="380" text-anchor="middle" font-size="10" fill="#9ca3af">All six queries run in parallel · ~250ms cold · ~80ms hot</text>
  <text x="400" y="398" text-anchor="middle" font-size="10" fill="#9ca3af">No LLM · No vector search · Reproducible to the byte</text>
</svg>
