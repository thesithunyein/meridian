<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="cold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="700" height="220" fill="#fafafa" rx="12"/>

  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">Performance</text>
  <text x="350" y="46" text-anchor="middle" font-size="10" fill="#6b7280">5K nodes · 18K edges · HydraDB 0.7.2</text>

  <!-- Labels -->
  <text x="80" y="90" text-anchor="end" font-size="10" font-weight="600" fill="#374151">Total</text>
  <text x="80" y="130" text-anchor="end" font-size="10" font-weight="600" fill="#374151">Tile 1</text>
  <text x="80" y="170" text-anchor="end" font-size="10" font-weight="600" fill="#374151">p95 Hot</text>

  <!-- Cold bars -->
  <rect x="90" y="78" width="400" height="20" rx="4" fill="url(#cold)" opacity="0.9"/>
  <text x="500" y="93" font-size="11" font-weight="700" fill="#4338ca">250ms</text>
  <text x="540" y="93" font-size="9" fill="#6b7280">cold</text>

  <rect x="90" y="118" width="176" height="20" rx="4" fill="url(#cold)" opacity="0.9"/>
  <text x="276" y="133" font-size="11" font-weight="700" fill="#4338ca">110ms</text>
  <text x="316" y="133" font-size="9" fill="#6b7280">cold</text>

  <!-- Warm bars -->
  <rect x="90" y="158" width="128" height="20" rx="4" fill="url(#warm)" opacity="0.9"/>
  <text x="228" y="173" font-size="11" font-weight="700" fill="#15803d">80ms</text>
  <text x="258" y="173" font-size="9" fill="#6b7280">warm</text>

  <!-- Hot bar for tile 1 -->
  <rect x="90" y="158" width="35" height="20" rx="4" fill="url(#warm)" opacity="0.5"/>
  <text x="135" y="173" font-size="11" font-weight="700" fill="#15803d">22ms</text>

  <!-- Legend -->
  <rect x="90" y="195" width="12" height="12" rx="2" fill="url(#cold)"/>
  <text x="108" y="206" font-size="9" fill="#6b7280">Cold start</text>
  <rect x="180" y="195" width="12" height="12" rx="2" fill="url(#warm)"/>
  <text x="198" y="206" font-size="9" fill="#6b7280">Warm (1k reuse)</text>
</svg>
