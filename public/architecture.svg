<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#fafafa" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b">Architecture</text>

  <!-- Layer 1: User -->
  <rect x="330" y="55" width="140" height="44" rx="22" fill="url(#purple)" filter="url(#s)"/>
  <text x="400" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="white">User Input</text>

  <!-- Arrow down -->
  <line x1="400" y1="99" x2="400" y2="125" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Frontend -->
  <rect x="180" y="128" width="440" height="50" rx="10" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="400" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Next.js 14 Frontend</text>
  <text x="400" y="166" text-anchor="middle" font-size="9" fill="#6b7280">Landing · Scan · Replay · Bench · How</text>

  <!-- Arrow down -->
  <line x1="400" y1="178" x2="400" y2="204" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: API -->
  <rect x="180" y="207" width="440" height="50" rx="10" fill="white" stroke="#a5b4fc" stroke-width="1.5" filter="url(#s)"/>
  <text x="400" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">API Routes</text>
  <text x="400" y="245" text-anchor="middle" font-size="9" fill="#6b7280">/api/scan · /api/bench · /api/health · /api/stats</text>

  <!-- Arrow down -->
  <line x1="400" y1="257" x2="400" y2="283" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: HydraDB Client -->
  <rect x="250" y="286" width="300" height="44" rx="10" fill="white" stroke="#22d3ee" stroke-width="1.5" filter="url(#s)"/>
  <text x="400" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#0891b2">HydraDB Client</text>
  <text x="400" y="306" text-anchor="middle" font-size="9" fill="#6b7280">Bolt + HTTPS transports</text>

  <!-- Arrow down -->
  <line x1="400" y1="330" x2="400" y2="356" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5: HydraDB -->
  <rect x="120" y="359" width="560" height="110" rx="12" fill="white" stroke="#f97316" stroke-width="2" stroke-dasharray="6,3" filter="url(#s)"/>
  <rect x="120" y="359" width="560" height="110" rx="12" fill="#fff7ed" opacity="0.5"/>
  <text x="620" y="379" text-anchor="end" font-size="9" font-weight="600" fill="#f97316">HydraDB 0.7.2</text>

  <!-- Cypher Engine -->
  <rect x="250" y="375" width="300" height="32" rx="6" fill="url(#orange)" filter="url(#s)"/>
  <text x="400" y="396" text-anchor="middle" font-size="11" font-weight="700" fill="white">Cypher Engine</text>

  <!-- Graph nodes -->
  <rect x="140" y="420" width="80" height="32" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="180" y="441" text-anchor="middle" font-size="10" font-weight="500" fill="#5b21b6">Package</text>

  <rect x="235" y="420" width="80" height="32" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="275" y="441" text-anchor="middle" font-size="10" font-weight="500" fill="#5b21b6">Version</text>

  <rect x="330" y="420" width="80" height="32" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="370" y="441" text-anchor="middle" font-size="10" font-weight="500" fill="#5b21b6">Advisory</text>

  <rect x="425" y="420" width="80" height="32" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="465" y="441" text-anchor="middle" font-size="10" font-weight="500" fill="#5b21b6">Lockfile</text>

  <rect x="520" y="420" width="90" height="32" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="565" y="441" text-anchor="middle" font-size="10" font-weight="500" fill="#5b21b6">Maintainer</text>

  <rect x="625" y="420" width="40" height="32" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="645" y="441" text-anchor="middle" font-size="10" font-weight="500" fill="#5b21b6">+4</text>

  <!-- Output arrows (right side) -->
  <line x1="620" y1="155" x2="680" y2="155" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="685" y="138" width="100" height="34" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1"/>
  <text x="735" y="160" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Verdict + Fix</text>

  <line x1="620" y1="232" x2="680" y2="232" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="685" y="215" width="100" height="34" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1"/>
  <text x="735" y="237" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">6 Tiles</text>

  <line x1="620" y1="310" x2="680" y2="310" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="685" y="293" width="100" height="34" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="735" y="315" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706">Worm Trace</text>

  <line x1="620" y1="391" x2="680" y2="391" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="685" y="374" width="100" height="34" rx="8" fill="#fce7f3" stroke="#f472b6" stroke-width="1"/>
  <text x="735" y="396" text-anchor="middle" font-size="10" font-weight="600" fill="#db2777">Bench CSV</text>

  <!-- Footer -->
  <text x="400" y="495" text-anchor="middle" font-size="9" fill="#9ca3af">meridian.sithunyein.com  ·  Apache-2.0  ·  Powered by HydraDB</text>
</svg>
