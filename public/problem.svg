<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, system-ui, sans-serif">
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d1d5db"/>
    </marker>
  </defs>

  <rect width="800" height="320" fill="#fafafa" rx="12"/>

  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b">The Problem: 6 Minutes to Compromise</text>

  <!-- Timeline -->
  <line x1="80" y1="80" x2="720" y2="80" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round"/>

  <!-- 09:00 -->
  <circle cx="120" cy="80" r="8" fill="#22c55e" stroke="white" stroke-width="2"/>
  <text x="120" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">09:00</text>
  <text x="120" y="124" text-anchor="middle" font-size="9" fill="#6b7280">CI breached</text>

  <!-- 09:01 -->
  <circle cx="240" cy="80" r="8" fill="#eab308" stroke="white" stroke-width="2"/>
  <text x="240" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">09:01</text>
  <text x="240" y="124" text-anchor="middle" font-size="9" fill="#6b7280">84 artifacts</text>

  <!-- 09:03 -->
  <circle cx="400" cy="80" r="8" fill="#f97316" stroke="white" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">09:03</text>
  <text x="400" y="124" text-anchor="middle" font-size="9" fill="#6b7280">42 packages hit</text>

  <!-- 09:05 -->
  <circle cx="560" cy="80" r="8" fill="#ef4444" stroke="white" stroke-width="2"/>
  <text x="560" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">09:05</text>
  <text x="560" y="124" text-anchor="middle" font-size="9" fill="#6b7280">Worm propagates</text>

  <!-- 09:06 -->
  <circle cx="680" cy="80" r="8" fill="#dc2626" stroke="white" stroke-width="2"/>
  <text x="680" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">09:06</text>
  <text x="680" y="124" text-anchor="middle" font-size="9" fill="#6b7280">160+ packages</text>

  <!-- Service boxes -->
  <rect x="80" y="170" width="100" height="50" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="130" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Service A</text>
  <text x="130" y="206" text-anchor="middle" font-size="9" fill="#6b7280">checkout</text>

  <rect x="220" y="170" width="100" height="50" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="270" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Service B</text>
  <text x="270" y="206" text-anchor="middle" font-size="9" fill="#6b7280">worker</text>

  <rect x="360" y="170" width="100" height="50" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="410" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Service C</text>
  <text x="410" y="206" text-anchor="middle" font-size="9" fill="#6b7280">billing</text>

  <rect x="500" y="170" width="100" height="50" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="550" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Service D</text>
  <text x="550" y="206" text-anchor="middle" font-size="9" fill="#6b7280">auth</text>

  <rect x="640" y="170" width="100" height="50" rx="8" fill="white" stroke="#c4b5fd" stroke-width="1.5" filter="url(#s)"/>
  <text x="690" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Service E</text>
  <text x="690" y="206" text-anchor="middle" font-size="9" fill="#6b7280">api-gw</text>

  <!-- Arrows between services -->
  <line x1="180" y1="195" x2="220" y2="195" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="320" y1="195" x2="360" y2="195" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="460" y1="195" x2="500" y2="195" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="195" x2="640" y2="195" stroke="#d1d5db" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Question -->
  <rect x="200" y="260" width="400" height="40" rx="20" fill="url(#red)" filter="url(#s)"/>
  <text x="400" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="white">Which services are transitively exposed?</text>
</svg>
